services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduroom}
      POSTGRES_USER: ${POSTGRES_USER:-eduroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduroom_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduroom}:${POSTGRES_PASSWORD:-eduroom_local_password}@db:5432/${POSTGRES_DB:-eduroom}?schema=public
      JWT_SECRET: ${JWT_SECRET:-desarrollo_local_cambiar_antes_de_publicar_1234}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      STRICT_INTEGRITY: ${STRICT_INTEGRITY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
