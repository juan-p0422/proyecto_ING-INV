databases:
  - name: eduroom-db
    databaseName: eduroom
    user: eduroom
    plan: free
    ipAllowList: []

services:
  - type: web
    name: eduroom
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm --prefix backend run db:generate && npm run build
    startCommand: npm --prefix backend run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduroom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: self
      - key: VITE_API_URL
        value: /api
      - key: NODE_ENV
        value: production
      - key: STRICT_INTEGRITY
        value: "false"
