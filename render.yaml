databases:
  - name: eduroom-db
    databaseName: eduroom
    user: eduroom
    plan: free
    ipAllowList: []

services:
  - type: web
    name: eduroom
    runtime: node
    plan: free
    # NODE_ENV=production is available during Render builds. Explicitly include
    # devDependencies because TypeScript, Vite and the @types packages are
    # build-time tools even though they are not needed by the running app.
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduroom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: self
      - key: VITE_API_URL
        value: /api
      - key: NODE_ENV
        value: production
      - key: STRICT_INTEGRITY
        value: "true"
